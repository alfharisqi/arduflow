$kind: http-request
method: POST
url: '{{base_url}}/api/workshops'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Workshop Postman {{$timestamp}}",
      "category": "IoT",
      "method": "online",
      "location": "https://example.com/meeting",
      "description": "Workshop integrasi API",
      "startsAt": "2026-08-10T09:00:00.000Z",
      "endsAt": "2026-08-10T12:00:00.000Z",
      "capacity": 25,
      "status": "draft"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Workshop dibuat', () => {
        const workshop = pm.response.json().workshop;
        pm.expect(workshop.id).to.exist;
        pm.expect(workshop.version).to.eql(1);
        pm.environment.set('workshop_id', String(workshop.id));
      });
