$kind: http-request
method: GET
url: '{{base_url}}/api/workshops/{{workshop_id}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('ID workshop sesuai', () => pm.expect(String(pm.response.json().workshop.id)).to.eql(pm.environment.get('workshop_id')));
