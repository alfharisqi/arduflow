$kind: http-request
method: PUT
url: '{{base_url}}/api/workshops/{{workshop_id}}'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Workshop Postman Updated",
      "category": "IoT",
      "method": "hybrid",
      "location": "Lab Arduflow",
      "description": "Workshop yang sudah diperbarui",
      "startsAt": "2026-08-10T09:00:00.000Z",
      "endsAt": "2026-08-10T12:00:00.000Z",
      "capacity": 30,
      "status": "published"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Versi bertambah dan status berubah', () => {
        const workshop = pm.response.json().workshop;
        pm.expect(workshop.version).to.be.above(1);
        pm.expect(workshop.status).to.eql('published');
      });
