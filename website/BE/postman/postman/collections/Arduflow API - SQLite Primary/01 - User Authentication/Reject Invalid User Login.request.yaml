$kind: http-request
method: POST
url: '{{base_url}}/api/auth/login'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{user_email}}",
      "password": "password-salah"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Login salah ditolak 401', () => pm.response.to.have.status(401));
