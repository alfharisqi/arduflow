$kind: http-request
method: POST
url: '{{base_url}}/api/auth/check-availability'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{user_email}}",
      "whatsapp": "{{user_whatsapp}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Email dan WhatsApp sudah terdaftar', () => {
        const json = pm.response.json();
        pm.expect(json.emailAvailable).to.eql(false);
        pm.expect(json.whatsappAvailable).to.eql(false);
      });
