$kind: http-request
method: GET
url: '{{base_url}}/api/auth/session'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{user_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Session milik user test', () => {
        pm.expect(pm.response.json().user.email).to.eql(pm.environment.get('user_email'));
      });
