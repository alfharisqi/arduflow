$kind: http-request
method: POST
url: '{{base_url}}/api/leads'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "",
      "email": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Payload tidak lengkap ditolak 422', () => pm.response.to.have.status(422));
