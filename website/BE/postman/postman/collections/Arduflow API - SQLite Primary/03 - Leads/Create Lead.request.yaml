$kind: http-request
method: POST
url: '{{base_url}}/api/leads'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Lead",
      "email": "lead.{{$timestamp}}@example.com",
      "phone": "+628123456789",
      "interest": "workshop",
      "message": "Pengujian lead dari Postman"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Lead diterima', () => pm.expect(pm.response.json().message).to.include('berhasil'));
