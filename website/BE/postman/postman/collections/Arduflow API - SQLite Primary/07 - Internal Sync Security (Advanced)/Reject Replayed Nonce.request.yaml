$kind: http-request
method: POST
url: '{{base_url}}/api/internal/sync/sqlite-to-mysql'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{sync_api_token}}'
  - key: X-Sync-Timestamp
    value: '{{sync_replay_timestamp}}'
  - key: X-Sync-Nonce
    value: '{{sync_replay_nonce}}'
  - key: X-Sync-Signature
    value: '{{sync_replay_signature}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "batchId": "postman-security-probe",
      "events": [
        {
          "eventId": "{{sync_probe_event_id}}",
          "tableName": "forbidden_table",
          "rowId": "1",
          "operation": "insert",
          "payload": { "id": 1 },
          "version": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Replay nonce ditolak 409', () => pm.response.to.have.status(409));
      pm.test('Pesan menunjukkan nonce pernah dipakai', () => pm.expect(pm.response.json().message).to.include('Nonce'));
