$kind: http-request
method: GET
url: '{{base_url}}/api/admin/session'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Role admin tersedia', () => pm.expect(pm.response.json().admin.role).to.exist);
