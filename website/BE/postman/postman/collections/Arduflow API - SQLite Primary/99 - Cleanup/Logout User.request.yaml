$kind: http-request
method: POST
url: '{{base_url}}/api/auth/logout'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{user_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Logout user berhasil', () => pm.response.to.have.status(200));
