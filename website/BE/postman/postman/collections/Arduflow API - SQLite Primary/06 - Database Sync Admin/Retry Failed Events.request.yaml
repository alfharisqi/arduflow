$kind: http-request
method: POST
url: '{{base_url}}/api/admin/database-sync/retry-failed'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Jumlah retry tersedia', () => pm.expect(pm.response.json().retried).to.be.a('number'));
