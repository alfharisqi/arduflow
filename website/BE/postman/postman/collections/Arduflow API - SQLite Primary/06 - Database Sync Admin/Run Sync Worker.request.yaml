$kind: http-request
method: POST
url: '{{base_url}}/api/admin/database-sync/run'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Hasil worker tersedia', () => pm.expect(pm.response.json().result).to.be.an('object'));
